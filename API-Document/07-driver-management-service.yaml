openapi: 3.0.3
info:
  title: CAB - Driver Management Service API
  description: >
    API quản lý hồ sơ Driver, phương tiện (Vehicle) và trạng thái sẵn sàng nhận chuyến.
    Nguồn: FR-005 → FR-006, FR-063 → FR-068, UC-11, UC-12, UC-13, AC-07.*.
  version: "1.0.0"
servers:
  - url: https://api.cab.example.com/v1

tags:
  - name: Driver Profile
  - name: Vehicle
  - name: Driver Availability
  - name: Operation - Driver Oversight

paths:
  /drivers/me:
    get:
      tags: [Driver Profile]
      summary: Xem hồ sơ Driver hiện tại
      operationId: getMyDriverProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
    put:
      tags: [Driver Profile]
      summary: Driver cập nhật thông tin cá nhân trong phạm vi quyền hạn
      description: FR-005, UC-11
      operationId: updateMyDriverProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/me/vehicle:
    get:
      tags: [Vehicle]
      summary: Xem thông tin phương tiện của Driver hiện tại
      description: UC-12
      operationId: getMyVehicle
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    put:
      tags: [Vehicle]
      summary: Driver cập nhật thông tin phương tiện
      description: FR-005, UC-12
      operationId: updateMyVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          description: Dữ liệu phương tiện không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/me/availability:
    patch:
      tags: [Driver Availability]
      summary: Bật / tắt trạng thái sẵn sàng nhận chuyến
      description: >
        FR-063, FR-064, FR-065, FR-066, FR-068, UC-13, AC-07.01 → AC-07.04.
        Chỉ Driver đang AVAILABLE mới được đưa vào quá trình matching.
      operationId: updateMyAvailability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [AVAILABLE, OFFLINE]
      responses:
        '200':
          description: Trạng thái sẵn sàng được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '409':
          description: Không thể chuyển OFFLINE khi đang có chuyến đang thực hiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /operations/drivers:
    get:
      tags: [Operation - Driver Oversight]
      summary: Operation Staff xem danh sách Driver và trạng thái hiện tại
      description: FR-067, UC-18, AC-16.02, AC-16.04
      operationId: listDriversForOperation
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, OFFLINE, ON_TRIP]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách Driver
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Driver'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalItems:
                    type: integer
        '403':
          description: Không có quyền Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /operations/drivers/{driverId}:
    put:
      tags: [Operation - Driver Oversight]
      summary: Operation Staff cập nhật hồ sơ Driver theo quyền được cấp
      description: FR-006
      operationId: updateDriverProfileByOperation
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        '200':
          description: Hồ sơ Driver được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '403':
          description: Không có quyền thực hiện thao tác này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Driver:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        phoneNumber:
          type: string
        licenseNumber:
          type: string
        availabilityStatus:
          type: string
          enum: [AVAILABLE, OFFLINE, ON_TRIP]
        currentLatitude:
          type: number
          nullable: true
        currentLongitude:
          type: number
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time

    DriverUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
        licenseNumber:
          type: string

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleTypeId:
          type: string
          format: uuid
        plateNumber:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string

    VehicleUpdateRequest:
      type: object
      properties:
        vehicleTypeId:
          type: string
          format: uuid
        plateNumber:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
