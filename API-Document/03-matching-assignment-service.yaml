openapi: 3.0.3
info:
  title: CAB - Driver Matching & Assignment Service API
  description: >
    API phục vụ quá trình tìm và phân công Driver cho Booking, cùng việc
    Driver nhận / accept / reject lời mời chuyến.
    Nguồn: FR-018 → FR-028, UC-14, UC-15, AC-03.03 → AC-03.07, AC-03.10, AC-04.*.
  version: "1.0.0"
servers:
  - url: https://api.cab.example.com/v1

tags:
  - name: Driver Trip Request
  - name: Assignment History

paths:
  /drivers/me/trip-requests:
    get:
      tags: [Driver Trip Request]
      summary: Driver lấy danh sách lời mời chuyến đang chờ phản hồi
      description: FR-020, UC-14, AC-13.03
      operationId: listMyTripRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách lời mời chuyến (assignment) đang PENDING cho Driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverAssignment'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/me/trip-requests/{assignmentId}/accept:
    post:
      tags: [Driver Trip Request]
      summary: Driver chấp nhận lời mời chuyến
      description: >
        FR-021, FR-025, UC-15 (Accept Flow), AC-03.04, AC-03.10, AC-04.07, AC-21.02, AC-21.03.
        Hệ thống đảm bảo chỉ một Driver được xác nhận cho một Booking tại cùng thời điểm.
      operationId: acceptTripRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Driver được xác nhận cho Booking, Trip được khởi tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAssignment'
        '409':
          description: >
            Booking đã được Driver khác accept trước đó, hoặc assignment đã
            hết hạn/timeout (AC-03.10, AC-04.07)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy lời mời chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/me/trip-requests/{assignmentId}/reject:
    post:
      tags: [Driver Trip Request]
      summary: Driver từ chối lời mời chuyến
      description: >
        FR-021, FR-023, FR-024, UC-15 (Reject Flow).
        Driver đã từ chối không được tiếp tục nhận lại cùng booking trong cùng vòng matching.
      operationId: rejectTripRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Đã ghi nhận từ chối, hệ thống tiếp tục tìm Driver khác (FR-023)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAssignment'
        '404':
          description: Không tìm thấy lời mời chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/{bookingId}/assignments:
    get:
      tags: [Assignment History]
      summary: Xem lịch sử các lần phân công Driver cho một Booking
      description: >
        Phục vụ audit/debug quá trình matching (Timeout/Reject/Accept).
        Dành cho Operation/Admin. Liên quan BR-03, entity DriverAssignment.
      operationId: listBookingAssignments
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Danh sách assignment theo thứ tự thời gian
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverAssignment'
        '403':
          description: Không có quyền truy cập (chỉ Operation/Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    DriverAssignment:
      type: object
      description: FR-018 → FR-027, entity DriverAssignment (ghi nhận Timeout/Reject/Accept)
      properties:
        assignmentId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, TIMEOUT]
        offeredAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
        pickupLocation:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
        dropoffLocation:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
